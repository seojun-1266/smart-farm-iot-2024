<text x="40" y="1132.0" font-size="14" fill="#3d4555">• 모든 모듈의 VCC → 5V, GND → GND 공통.  HC-06은 SoftwareSerial(9600bps)로 통신.</text>
<text x="40" y="1156.0" font-size="14" fill="#3d4555">• v2 (2024-08 방학 버전)은 4x4 키패드 전체 사용: ROW D5·D4·D3·D2, COL A3·A2·A1·A0</text>
<text x="40" y="1180.0" font-size="14" fill="#3d4555">  → A0~A2가 토양·조도·불꽃 센서와 겹침 (README '아쉬운 점' 참고).</text>
