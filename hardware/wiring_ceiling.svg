<text x="40" y="840.0" font-size="14" fill="#3d4555">• 모든 모듈의 VCC → 5V, GND → GND 공통.  네오픽셀 60구는 전류가 커서 별도 5V 전원 권장(GND는 아두이노와 공통).</text>
<text x="40" y="864.0" font-size="14" fill="#3d4555">• v1 (2024-06 전시회)은 네오픽셀·버튼·팬 대신 일반 LED 1개를 D12에 연결 (나머지 핀 동일).</text>
<text x="40" y="888.0" font-size="14" fill="#3d4555">• 천장부는 건전지로 따로 전원을 공급해 바닥부와 분리된 독립 보드로 동작.</text>
